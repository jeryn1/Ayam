<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Ayam Segar - Bahan Baku Berkualitas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="logo">
                <h1> Toko Ayam Segar</h1>
                <p>Bahan Baku Ayam Berkualitas & Terpercaya</p>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h2>Katalog Produk Kami</h2>
            <p>Pilih produk ayam segar berkualitas untuk kebutuhan Anda</p>
        </div>
    </section>

    <!-- Product Catalog -->
    <section class="products">
        <div class="container">
            <div class="product-grid" id="productGrid">
                <!-- Products will be inserted here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Form Pemesanan</h2>
            <div class="product-info">
                <img id="modalProductImage" src="" alt="Product">
                <div class="modal-product-details">
                    <h3 id="modalProductName"></h3>
                    <p class="price">Rp <span id="modalProductPrice"></span> / kg</p>
                </div>
            </div>
            
            <form id="orderForm">
                <div class="form-group">
                    <label for="qty">Jumlah (kg):</label>
                    <input type="number" id="qty" min="1" value="1" required>
                </div>
                
                <div class="form-group">
                    <label for="total">Total Harga:</label>
                    <input type="text" id="total" readonly>
                </div>
                
                <div class="form-group">
                    <label for="name">Nama Pembeli:</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">No. HP:</label>
                    <input type="tel" id="phone" required>
                </div>
                
                <div class="form-group">
                    <label for="address">Alamat Pengiriman:</label>
                    <textarea id="address" rows="3" required></textarea>
                </div>
                
                <button type="submit" class="btn-whatsapp">
                    📱 Kirim Pesanan via WhatsApp
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Toko Ayam Segar. All rights reserved.</p>
            <p>Hubungi kami: 081322363337</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
